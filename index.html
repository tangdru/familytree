<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Tree</title>
<!-- Bump the ?v= query string on style.css/config.js/app.js below whenever
     they change, so iOS Safari's aggressive caching can't serve a stale
     script/stylesheet alongside a freshly-fetched index.html. -->
<link rel="stylesheet" href="style.css?v=20260907j">
</head>
<body>
  <header class="toolbar">
    <button id="addPersonBtn" class="toolbar-add-btn" aria-label="Add person" title="Add person">+</button>
    <div class="search-wrap" id="searchWrap">
      <button id="searchToggleBtn" class="search-toggle-btn" type="button" aria-label="Search" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>
      <input id="searchInput" class="search-input" type="search" placeholder="Search people…" autocomplete="off">
    </div>
    <div class="toolbar-spacer"></div>
    <select id="viewModeSelect" class="view-mode-select" aria-label="Tree view">
      <option value="traditional">Traditional Tree</option>
      <option value="chronological">Chronological Tree</option>
    </select>
    <span id="syncStatus" class="sync-dot local" title="Local only"></span>
    <h1 class="toolbar-title">Family Tree</h1>
    <button id="exportBtn" class="btn" hidden>Export JSON</button>
  </header>

  <main id="treeViewport" class="tree-viewport">
    <div id="treeCanvas" class="tree-canvas">
      <svg id="linesSvg" class="lines-svg"></svg>
      <div id="treeContent" class="tree-content"></div>
    </div>
    <div id="chronoRuler" class="chrono-ruler" hidden>
      <div id="chronoRulerInner" class="chrono-ruler-inner"></div>
    </div>
    <p id="emptyState" class="empty-state" hidden>
      No one in the tree yet. Click <strong>+ Add Person</strong> to start building your family tree.
    </p>
  </main>

  <!-- Add / Edit Person Modal -->
  <div id="personModal" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Add Person</h2>
        <button id="closeModalBtn" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <form id="personForm" class="modal-body" autocomplete="off">
        <input type="hidden" id="personId">

        <div class="form-row photo-row">
          <label class="photo-preview" id="photoPreview" for="photoInput" aria-label="Choose photo">
            <span id="photoPlaceholder">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                <circle cx="12" cy="13" r="4"></circle>
              </svg>
            </span>
            <img id="photoImg" alt="" hidden>
          </label>
          <div class="photo-controls">
            <label class="btn" id="updatePhotoLabel" for="photoInput" hidden>Update Photo</label>
            <input id="photoInput" type="file" accept="image/*" hidden>
            <button type="button" id="removePhotoBtn" class="icon-btn" aria-label="Remove photo" title="Remove photo" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                <path d="M10 11v6"></path>
                <path d="M14 11v6"></path>
                <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-row">
          <label id="nameLabel">Full name *</label>
          <div id="nameInput" class="editable-text" contenteditable="true" role="textbox" aria-labelledby="nameLabel" data-placeholder="e.g. Jane Doe" autocorrect="off" spellcheck="false"></div>
        </div>

        <div class="form-row two-col">
          <div>
            <label for="birthInput">Born</label>
            <div class="date-field">
              <input id="birthInput" type="date">
              <div class="date-display placeholder" id="birthDisplay" aria-hidden="true">
                <span class="date-display-text">mm/dd/yyyy</span>
                <span class="date-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="4" width="18" height="18" rx="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                  </svg>
                </span>
              </div>
            </div>
          </div>
          <div>
            <label for="deathInput">Died</label>
            <div class="date-field">
              <input id="deathInput" type="date">
              <div class="date-display placeholder" id="deathDisplay" aria-hidden="true">
                <span class="date-display-text">mm/dd/yyyy</span>
                <span class="date-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="4" width="18" height="18" rx="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                  </svg>
                </span>
              </div>
            </div>
          </div>
        </div>

        <div class="form-row">
          <label id="locationLabel">Location</label>
          <div class="location-field">
            <div id="locationInput" class="editable-text" contenteditable="true" role="textbox" aria-labelledby="locationLabel" data-placeholder="City, Country" autocorrect="off" spellcheck="false"></div>
            <div class="combo-dropdown location-suggestions" id="locationSuggestions" hidden>
              <div class="combo-options"></div>
            </div>
          </div>
        </div>

        <div class="form-row two-col">
          <div>
            <label id="parent1Label">Parent 1</label>
            <div class="combo" id="parent1Combo">
              <button type="button" class="combo-trigger placeholder" aria-labelledby="parent1Label" aria-haspopup="listbox" aria-expanded="false">
                <span class="combo-trigger-text">Select…</span>
              </button>
              <button type="button" class="combo-clear" id="parent1Clear" aria-label="Clear parent 1" hidden>✕</button>
              <div class="combo-dropdown" id="parent1Dropdown" hidden>
                <div class="combo-filter-wrap">
                  <span class="combo-filter-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                  </span>
                  <input type="text" class="combo-filter" placeholder="" aria-label="Filter" autocomplete="off">
                </div>
                <div class="combo-options"></div>
              </div>
            </div>
          </div>
          <div>
            <label id="parent2Label">Parent 2</label>
            <div class="combo" id="parent2Combo">
              <button type="button" class="combo-trigger placeholder" aria-labelledby="parent2Label" aria-haspopup="listbox" aria-expanded="false">
                <span class="combo-trigger-text">Select…</span>
              </button>
              <button type="button" class="combo-clear" id="parent2Clear" aria-label="Clear parent 2" hidden>✕</button>
              <div class="combo-dropdown" id="parent2Dropdown" hidden>
                <div class="combo-filter-wrap">
                  <span class="combo-filter-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                  </span>
                  <input type="text" class="combo-filter" placeholder="" aria-label="Filter" autocomplete="off">
                </div>
                <div class="combo-options"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="form-row">
          <label id="spousesLabel">Spouse(s) / Partner(s)</label>
          <div class="combo combo-multi" id="spousesCombo">
            <div class="combo-chips" id="spousesChips"></div>
            <button type="button" class="combo-trigger placeholder" aria-labelledby="spousesLabel" aria-haspopup="listbox" aria-expanded="false">
              <span class="combo-trigger-text">Add spouse/partner…</span>
            </button>
            <div class="combo-dropdown" id="spousesDropdown" hidden>
              <div class="combo-filter-wrap">
                <span class="combo-filter-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </span>
                <input type="text" class="combo-filter" placeholder="" aria-label="Filter" autocomplete="off">
              </div>
              <div class="combo-options"></div>
            </div>
          </div>
        </div>

        <div class="form-row">
          <label for="notesInput">Notes</label>
          <textarea id="notesInput" rows="2" placeholder="Optional notes"></textarea>
        </div>

        <div class="modal-footer">
          <button type="button" id="deletePersonBtn" class="btn btn-danger">Delete</button>
          <div class="spacer"></div>
          <button type="button" id="cancelBtn" class="btn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Photo crop overlay -->
  <div id="cropModal" class="modal-overlay" hidden>
    <div class="modal crop-modal">
      <div class="modal-header">
        <h2>Adjust Photo</h2>
        <button id="cropCloseBtn" type="button" class="icon-btn" aria-label="Cancel">✕</button>
      </div>
      <div class="modal-body">
        <div class="crop-viewport" id="cropViewport">
          <img id="cropImage" alt="" draggable="false">
        </div>
        <div class="crop-zoom-row">
          <span aria-hidden="true">−</span>
          <input type="range" id="cropZoom" min="1" max="3" step="0.01" value="1">
          <span aria-hidden="true">+</span>
        </div>
        <p class="hint">Drag to reposition, use the slider (or pinch) to zoom.</p>
        <div class="modal-footer">
          <div class="spacer"></div>
          <button type="button" id="cropCancelBtn" class="btn">Cancel</button>
          <button type="button" id="cropApplyBtn" class="btn btn-primary">Apply</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Person View (read-only detail) Modal -->
  <div id="personViewModal" class="modal-overlay" hidden>
    <div class="modal view-modal">
      <div class="modal-header">
        <h2>Person</h2>
        <button id="viewCloseModalBtn" type="button" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <div class="view-swipe-zone" id="viewSwipeZone">
          <div class="view-person" id="viewPersonSingle">
            <div class="view-photo" id="viewPhoto">
              <span id="viewPhotoPlaceholder">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                  <circle cx="12" cy="13" r="4"></circle>
                </svg>
              </span>
              <img id="viewPhotoImg" alt="" hidden>
            </div>
            <h3 class="view-name" id="viewName"></h3>
            <p class="view-dates" id="viewDates" hidden></p>
          </div>
          <!-- A couple's shared card: two equal-size member blocks, built and
               populated in JS by buildCoupleMember() -- see renderPersonView(). -->
          <div class="view-couple" id="viewCouple" hidden></div>
          <div class="view-spouse-avatars" id="viewSpouseAvatars" hidden></div>
          <p class="view-location" id="viewLocation" hidden></p>
        </div>
        <p class="view-notes" id="viewNotes" hidden></p>

        <div class="view-section" id="viewParentsSection" hidden>
          <h4>Parents</h4>
          <ul class="view-relation-list" id="viewParentsList"></ul>
        </div>
        <div class="view-section" id="viewSiblingsSection" hidden>
          <h4>Siblings</h4>
          <ul class="view-relation-list" id="viewSiblingsList"></ul>
        </div>
        <div class="view-section" id="viewSpousesSection" hidden>
          <h4>Spouses</h4>
          <ul class="view-relation-list" id="viewSpousesList"></ul>
        </div>
        <div class="view-section" id="viewChildrenSection" hidden>
          <h4>Children</h4>
          <ul class="view-relation-list" id="viewChildrenList"></ul>
        </div>
      </div>
      <div class="modal-footer">
        <div class="spacer"></div>
        <button type="button" id="viewCloseBtn" class="btn">Close</button>
        <button type="button" id="viewEditBtn" class="btn btn-primary">Edit</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=20260907j"></script>
  <script src="app.js?v=20260907j"></script>
</body>
</html>
